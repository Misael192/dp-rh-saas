events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  # Request paths can contain private identifiers; avoid a default access log.
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Always overwrite a client-supplied header. Next.js trusts only this
      # ingress-owned header; NestJS additionally verifies the shared secret.
      proxy_set_header X-Peopleflow-Ingress-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Origin $http_origin;
      proxy_set_header Cookie $http_cookie;
      proxy_read_timeout 30s;
    }
  }
}
